org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:+HeapDumpOnOutOfMemoryError
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true

# Added by the Flutter 3.47 template: AGP 9 ships the new DSL and built-in
# Kotlin, but Flutter's own Gradle plugin still relies on the legacy DSL and
# on the Kotlin Gradle Plugin, so both are pinned to their compatible mode.
android.newDsl=false
android.builtInKotlin=false
